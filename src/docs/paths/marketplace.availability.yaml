/marketplace/availability/{alias}/{itemId}:
  get:
    tags:
      - Marketplace
    summary: Get item availability and store matrix
    description: Returns catalog availability, prices, subscriptions, compatibility metadata, stores, and official catalog deep links. Content URLs and keys are never returned.
    security:
      - BearerAuth: [ ]
    parameters:
      - in: path
        name: alias
        required: true
        schema:
          type: string
      - in: path
        name: itemId
        required: true
        schema:
          type: string
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      "404":
        description: Item not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
